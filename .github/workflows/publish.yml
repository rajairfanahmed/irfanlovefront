name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-npm:
    name: Publish to npm Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: npm ci

      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions -> Repository secrets and add NPM_TOKEN."
            exit 1
          fi
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com/'

      - name: Install Dependencies
        run: npm ci

      - name: Scope Package Name for GitHub Packages
        run: npm pkg set name=@rajairfanahmed/irfanlovefront

      - name: Publish to GitHub Packages
        run: |
          npm publish || echo "Notice: Package version may already be published on GitHub Packages (409 Conflict bypassed)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
